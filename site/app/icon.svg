<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Unc.Fund vest mark">
  <title>Half-zipped vest mark. Favicon, app icon, embroidered patch.</title>
  <rect width="64" height="64" rx="14" fill="#2F5D8A"/>
  <!-- vest body -->
  <path d="M18 18 Q32 12 46 18 L48 50 Q32 55 16 50 Z" fill="#F7F3EA"/>
  <!-- armholes -->
  <path d="M18 18 Q14 26 16 34 L20 34 Q19 26 22 19 Z" fill="#2F5D8A"/>
  <path d="M46 18 Q50 26 48 34 L44 34 Q45 26 42 19 Z" fill="#2F5D8A"/>
  <!-- open collar -->
  <path d="M27 17 L32 30 L37 17 Z" fill="#2F5D8A"/>
  <!-- zipper track, half done -->
  <line x1="32" y1="30" x2="32" y2="52" stroke="#2F5D8A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- pull -->
  <rect x="29.5" y="28" width="5" height="7" rx="1.5" fill="#7FA7CF"/>
  <!-- chest patch -->
  <rect x="37" y="36" width="7" height="4" rx="1" fill="#2F5D8A"/>
</svg>

    <path d="M290 212 L314 212 M290 220 L314 220" stroke="#1E2430" stroke-width="1.8" stroke-linecap="round"/>
    <use xlink:href="#legs"/><use xlink:href="#torso"/><use xlink:href="#head-base"/><use xlink:href="#eyes-open"/><use xlink:href="#mouth-grin"/>
    <text x="160" y="430" text-anchor="middle" font-family="Fredoka, Arial, sans-serif" font-size="16" font-weight="600" fill="#2F5D8A">03 APPROVE</text>
  </g>


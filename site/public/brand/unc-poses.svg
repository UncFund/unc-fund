  <rect width="1920" height="480" fill="#F7F3EA"/>

  <!-- 01 idle -->
  <g transform="translate(0 20)">
    <use xlink:href="#arm-left"/><use xlink:href="#sleeve-right"/><use xlink:href="#hand-rest"/>
    <use xlink:href="#legs"/><use xlink:href="#torso"/><use xlink:href="#head-base"/><use xlink:href="#eyes-open"/><use xlink:href="#mouth-smile"/>
    <text x="160" y="430" text-anchor="middle" font-family="Fredoka, Arial, sans-serif" font-size="16" font-weight="600" fill="#2F5D8A">01 IDLE</text>
  </g>

  <!-- 02 wave -->
  <g transform="translate(320 20)">
    <use xlink:href="#arm-left"/>
    <g transform="rotate(-150 233 210)"><use xlink:href="#sleeve-right"/><use xlink:href="#hand-open"/></g>
    <use xlink:href="#legs"/><use xlink:href="#torso"/><use xlink:href="#head-base"/><use xlink:href="#eyes-open"/><use xlink:href="#mouth-smile"/>
    <text x="160" y="430" text-anchor="middle" font-family="Fredoka, Arial, sans-serif" font-size="16" font-weight="600" fill="#2F5D8A">02 WAVE</text>
  </g>


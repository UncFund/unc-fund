      <path d="M210 70 L204 84 L226 70 Z" fill="#FFFFFF" stroke="#1E2430" stroke-width="2"/>
      <text x="259" y="55" text-anchor="middle" font-family="Fredoka, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E2430">what is a zk rollup</text>

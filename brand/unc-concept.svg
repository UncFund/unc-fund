<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400">
  <title>Unc concept sketch: friendly Unc in a half-zipped fleece vest</title>
  <rect width="320" height="400" fill="#F7F3EA"/>
  <!-- legs -->
  <rect x="118" y="290" width="34" height="80" rx="10" fill="#D9C8A6"/>
  <rect x="168" y="290" width="34" height="80" rx="10" fill="#D9C8A6"/>
  <!-- shoes -->
  <rect x="108" y="360" width="50" height="22" rx="11" fill="#9AA3AD"/>
  <rect x="162" y="360" width="50" height="22" rx="11" fill="#9AA3AD"/>
  <!-- shirt -->
  <rect x="96" y="190" width="128" height="120" rx="26" fill="#BFD7EA"/>
  <!-- sleeves -->
  <rect x="70" y="200" width="36" height="90" rx="18" fill="#BFD7EA"/>
  <rect x="214" y="200" width="36" height="90" rx="18" fill="#BFD7EA"/>
  <!-- vest -->
  <path d="M110 192 Q160 178 210 192 L214 300 Q160 312 106 300 Z" fill="#2F5D8A"/>
  <!-- vest collar / open top -->
  <path d="M150 192 L160 232 L170 192 Z" fill="#BFD7EA"/>
  <!-- zipper -->
  <line x1="160" y1="232" x2="160" y2="302" stroke="#7FA7CF" stroke-width="3"/>
  <circle cx="160" cy="232" r="4" fill="#7FA7CF"/>
  <!-- vest patch -->
  <rect x="176" y="242" width="26" height="12" rx="3" fill="#F7F3EA"/>
  <text x="189" y="252" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="#2F5D8A">UNC</text>
  <!-- hands in pockets -->
  <ellipse cx="88" cy="288" rx="16" ry="12" fill="#E8C4A0"/>
  <ellipse cx="232" cy="288" rx="16" ry="12" fill="#E8C4A0"/>
  <!-- neck -->
  <rect x="146" y="164" width="28" height="30" fill="#E8C4A0"/>
  <!-- head -->
  <circle cx="160" cy="120" r="64" fill="#E8C4A0"/>
  <!-- ears -->
  <circle cx="96" cy="124" r="10" fill="#E8C4A0"/>
  <circle cx="224" cy="124" r="10" fill="#E8C4A0"/>
  <!-- hair: grey at temples, thinning on top -->
  <path d="M100 110 Q104 70 140 66 Q160 62 180 66 Q216 70 220 110 Q200 96 160 94 Q120 96 100 110 Z" fill="#8C8F94"/>
  <path d="M96 112 Q92 140 100 150 L104 118 Z" fill="#8C8F94"/>
  <path d="M224 112 Q228 140 220 150 L216 118 Z" fill="#8C8F94"/>
  <!-- readers pushed up on forehead -->
  <rect x="122" y="86" width="30" height="16" rx="8" fill="none" stroke="#1E2430" stroke-width="3"/>
  <rect x="168" y="86" width="30" height="16" rx="8" fill="none" stroke="#1E2430" stroke-width="3"/>
  <line x1="152" y1="94" x2="168" y2="94" stroke="#1E2430" stroke-width="3"/>
  <!-- eyebrows: the acting -->
  <path d="M124 116 Q136 106 150 114" fill="none" stroke="#1E2430" stroke-width="4" stroke-linecap="round"/>
  <path d="M170 114 Q184 106 196 116" fill="none" stroke="#1E2430" stroke-width="4" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="138" cy="128" r="5" fill="#1E2430"/>
  <circle cx="182" cy="128" r="5" fill="#1E2430"/>
  <!-- nose -->
  <path d="M160 130 Q154 146 162 148" fill="none" stroke="#C99A72" stroke-width="3" stroke-linecap="round"/>
  <!-- mustache -->
  <path d="M136 156 Q160 146 184 156 Q160 164 136 156 Z" fill="#8C8F94"/>
  <!-- smile -->
  <path d="M142 166 Q160 178 178 166" fill="none" stroke="#1E2430" stroke-width="3" stroke-linecap="round"/>
  <!-- speech bubble -->
  <rect x="222" y="30" width="86" height="44" rx="12" fill="#FFFFFF" stroke="#1E2430" stroke-width="2"/>
  <path d="M232 74 L226 88 L246 74 Z" fill="#FFFFFF" stroke="#1E2430" stroke-width="2"/>
  <text x="265" y="49" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1E2430">Proud of</text>
  <text x="265" y="64" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1E2430">you.</text>
  <!-- wordmark -->
  <text x="160" y="396" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2F5D8A">UNC<tspan font-weight="400" fill="#1E2430">.FUND</tspan></text>
</svg>
